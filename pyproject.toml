[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3"]
build-backend = "scikit_build_core.build"

[project]
name = "yapping"
version = "0.1.0"
description = "Deterministic combo search over OCGCore game states"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
wheel.packages = ["src/yapping"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
