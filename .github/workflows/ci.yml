name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsqlite3-dev
      - name: Install pinned Lua card scripts
        run: |
          git clone https://github.com/Fluorohydride/ygopro-scripts.git ../fluorohydride-ygopro-scripts
          git -C ../fluorohydride-ygopro-scripts checkout 090e881772f488e1256c456b827d5cbed4facf79
      - name: Build and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest -q
